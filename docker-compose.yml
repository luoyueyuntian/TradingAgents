name: tradingagents

services:
  tradingagents:
    build: .
    environment:
      - TRADINGAGENTS_WEB_RUN_MODE=${TRADINGAGENTS_WEB_RUN_MODE:-local_thread}
      - TRADINGAGENTS_WEB_STATE_BACKEND=${TRADINGAGENTS_WEB_STATE_BACKEND:-file}
      - TRADINGAGENTS_WEB_SQLITE_PATH=${TRADINGAGENTS_WEB_SQLITE_PATH:-/home/appuser/.tradingagents/web/state.db}
      - TRADINGAGENTS_WEB_AUTH_DB=${TRADINGAGENTS_WEB_AUTH_DB:-}
      - TRADINGAGENTS_WEB_API_TOKEN=${TRADINGAGENTS_WEB_API_TOKEN:-}
      - TRADINGAGENTS_WEB_CORS_ORIGINS=${TRADINGAGENTS_WEB_CORS_ORIGINS:-}
      - TRADINGAGENTS_ADMIN_EMAIL=${TRADINGAGENTS_ADMIN_EMAIL:-}
      - TRADINGAGENTS_ADMIN_USERNAME=${TRADINGAGENTS_ADMIN_USERNAME:-}
      - TRADINGAGENTS_ADMIN_PASSWORD=${TRADINGAGENTS_ADMIN_PASSWORD:-}
      - TRADINGAGENTS_ADMIN_TENANT_ID=${TRADINGAGENTS_ADMIN_TENANT_ID:-}
      - TRADINGAGENTS_ADMIN_DISPLAY_NAME=${TRADINGAGENTS_ADMIN_DISPLAY_NAME:-}
      - TRADINGAGENTS_SESSION_COOKIE_SECURE=${TRADINGAGENTS_SESSION_COOKIE_SECURE:-}
      - TRADINGAGENTS_SMTP_HOST=${TRADINGAGENTS_SMTP_HOST:-}
      - TRADINGAGENTS_SMTP_PORT=${TRADINGAGENTS_SMTP_PORT:-}
      - TRADINGAGENTS_SMTP_USER=${TRADINGAGENTS_SMTP_USER:-}
      - TRADINGAGENTS_SMTP_PASSWORD=${TRADINGAGENTS_SMTP_PASSWORD:-}
      - TRADINGAGENTS_SMTP_FROM=${TRADINGAGENTS_SMTP_FROM:-}
      - TRADINGAGENTS_SMTP_TLS=${TRADINGAGENTS_SMTP_TLS:-}
      - TRADINGAGENTS_LLM_PROVIDER=${TRADINGAGENTS_LLM_PROVIDER:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    ports:
      - "127.0.0.1:8000:8000"
    tty: true
    stdin_open: true

  tradingagents-worker:
    build: .
    environment:
      - TRADINGAGENTS_WEB_RUN_MODE=external_worker
      - TRADINGAGENTS_WEB_STATE_BACKEND=${TRADINGAGENTS_WEB_STATE_BACKEND:-sqlite}
      - TRADINGAGENTS_WEB_SQLITE_PATH=${TRADINGAGENTS_WEB_SQLITE_PATH:-/home/appuser/.tradingagents/web/state.db}
      - TRADINGAGENTS_LLM_PROVIDER=${TRADINGAGENTS_LLM_PROVIDER:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    command: ["python", "-m", "web.worker"]
    tty: true
    stdin_open: true
    profiles:
      - external-worker

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
